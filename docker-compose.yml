version: '3.8'
services:
  api:
    build: .
    container_name: chatfit_api
    ports:
    - 8000:8000
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    volumes:
    - ~/.iron:/root/.iron
    - "~/Documents/LifeOS/\u4E0B\u53A8\u623F/:/root/Documents/LifeOS/\u4E0B\u53A8\u623F\
      /"
    - ./chroma.db:/app/chroma.db
    - ./runtime-data:/app/data
    env_file:
    - .env
    environment:
    - CHECKPOINTER_DB_PATH=/app/data/checkpointer.db
    - USER_MEMORY_DB_PATH=/app/data/user-memory.db
    extra_hosts:
    - host.docker.internal:host-gateway

  bot:
    build: .
    container_name: chatfit_bot
    command: python bot.py
    depends_on:
    - api
    env_file:
    - .env
    environment:
    - API_URL=http://api:8000/chat
    - API_CLEAR_URL=http://api:8000/clear
    - API_RESUME_URL=http://api:8000/resume
    - API_PROACTIVE_REVIEW_URL=http://api:8000/proactive-review
    extra_hosts:
    - host.docker.internal:host-gateway
