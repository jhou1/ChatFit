{{- include "chatfit.validateValues" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chatfit.fullname" . }}-api
  labels:
    {{- include "chatfit.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "chatfit.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "chatfit.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "chatfit.serviceAccountName" . }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: prepare-data
          image: {{ include "chatfit.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-ec"]
          args:
            - mkdir -p /storage/iron /storage/runtime-data /storage/chroma.db /storage/cookbook
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /storage
      containers:
        - name: api
          image: {{ include "chatfit.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn"]
          args: ["api:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "chatfit.fullname" . }}-config
          env:
            - name: CHECKPOINTER_DB_PATH
              value: /app/data/checkpointer.db
            - name: USER_MEMORY_DB_PATH
              value: /app/data/user-memory.db
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret is required" .Values.existingSecret }}
                  key: {{ .Values.secretKeys.googleApiKey }}
            - name: CHATFIT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret is required" .Values.existingSecret }}
                  key: {{ .Values.secretKeys.chatfitApiToken }}
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret is required" .Values.existingSecret }}
                  key: {{ .Values.secretKeys.langfuseSecretKey }}
                  optional: true
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret is required" .Values.existingSecret }}
                  key: {{ .Values.secretKeys.langfusePublicKey }}
                  optional: true
            - name: OBSERVABILITY_HASH_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret is required" .Values.existingSecret }}
                  key: {{ .Values.secretKeys.observabilityHashKey }}
                  optional: true
            - name: LLM_PROXY
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret is required" .Values.existingSecret }}
                  key: {{ .Values.secretKeys.llmProxy }}
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /root/.iron
              subPath: iron
            - name: data
              mountPath: /app/data
              subPath: runtime-data
            - name: data
              mountPath: /app/chroma.db
              subPath: chroma.db
            - name: data
              mountPath: /root/Documents/LifeOS/下厨房
              subPath: cookbook
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            tcpSocket:
              port: http
            {{- toYaml .Values.api.startupProbe | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: http
            {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: http
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "chatfit.fullname" . }}-data
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
