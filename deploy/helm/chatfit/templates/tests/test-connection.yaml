{{- include "chatfit.validateValues" . -}}
{{- $apiURL := printf "http://%s:8000/docs" (include "chatfit.apiServiceName" .) -}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "chatfit.fullname" . }}-connection-test
  labels:
    {{- include "chatfit.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  serviceAccountName: {{ include "chatfit.serviceAccountName" . }}
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: connection-test
      image: {{ include "chatfit.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: ["python", "-c"]
      args:
        - {{ printf "import urllib.request; urllib.request.urlopen(%q, timeout=10)" $apiURL | quote }}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
